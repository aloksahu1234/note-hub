<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url("https://images.unsplash.com/photo-1524995997946-a1c2e315a42f");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        /* Dark overlay */
        .overlay {
            background: rgba(0, 0, 0, 0.6);
            height: 100vh;
            padding-top: 100px;
        }

        /* Button & link style */
        a,
        button {
            display: inline-block;
            margin: 12px;
            padding: 12px 25px;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;

            /* Smooth animation */
            transition: all 0.3s ease;
        }

        /* 🔥 Hover Effect */
        a:hover,
        button:hover {
            background: #09aac6;
            color: black;
            transform: scale(1.1);
            /* zoom effect */
            box-shadow: 0 0 15px #00c6ff, 0 0 30px #00c6ff;
        }

        /* Click effect */
        a:active,
        button:active {
            transform: scale(0.95);
        }
    </style>

</head>

<body>

    <div class="overlay">
        <h2>Welcome to Notes hub</h2>
        <p id="user"></p>

        <a href="upload.html">Upload Book</a><br>
        <a href="books.html">View Books</a><br>

        <button onclick="logout()">Logout</button>
    </div>

    <script>
        let user = JSON.parse(localStorage.getItem("loggedInUser"));

        if (!user) {
            window.location.href = "login.html";
        } else {
            document.getElementById("user").innerText = "Hello, " + user.name;
        }

        function logout() {
            localStorage.removeItem("loggedInUser");
            window.location.href = "login.html";
        }
    </script>

</body>

</html>
